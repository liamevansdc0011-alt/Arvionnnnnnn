<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Fast Mailer</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 35px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 320px; border: 1px solid #334155; }
    h2 { text-align: center; margin-bottom: 25px; color: #38bdf8; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #475569; background: #0f172a; color: #fff; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }
    button:hover { background: #0369a1; }
    .error { color: #f87171; text-align: center; margin-top: 15px; font-size: 14px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Fast Mailer Login</h2>
    <!-- Direct native form post -->
    <form action="/login" method="POST">
      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
    <div id="errorMsg" class="error">❌ Invalid Username or Password</div>
  </div>

  <script>
    if (window.location.search.includes('error=invalid')) {
      document.getElementById('errorMsg').style.display = 'block';
    }
  </script>
</body>
</html>
