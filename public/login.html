<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Fast Mailer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-container {
      background: #ffffff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h2 {
      color: #333;
      font-size: 24px;
      margin-bottom: 5px;
    }

    .login-header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      color: #444;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #007bff;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #0056b3;
    }

    .error-message {
      background-color: #ffe6e6;
      color: #d9534f;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <h2>Fast Mailer</h2>
      <p>Login to your account</p>
    </div>

    <!-- Error Alert Box -->
    <div id="errorBox" class="error-message"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Login</button>
    </form>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Clear previous errors
      errorBox.style.display = 'none';
      errorBox.innerText = '';
      submitBtn.innerText = 'Logging in...';
      submitBtn.disabled = true;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          // Success: Redirect to Dashboard
          window.location.href = '/dashboard';
        } else {
          // Failure: Display error message
          errorBox.innerText = data.message || 'Invalid username or password';
          errorBox.style.display = 'block';
        }
      } catch (err) {
        console.error('Login Fetch Error:', err);
        errorBox.innerText = 'Server error. Please try again later.';
        errorBox.style.display = 'block';
      } finally {
        submitBtn.innerText = 'Login';
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
