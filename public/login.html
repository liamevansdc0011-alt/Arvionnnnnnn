<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast Mailer — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;padding:20px}
.card{background:#ffffff;border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(15,23,42,0.25)}
.logo{text-align:center;margin-bottom:28px}
.logo-icon{font-size:48px;display:block;margin-bottom:10px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.logo-title{font-size:26px;font-weight:700;color:#0f172a}
.logo-title span{color:#4f46e5;background:linear-gradient(135deg,#4f46e5,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#64748b;font-size:14px;margin-top:6px;font-weight:500}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:6px}
.field input{width:100%;padding:12px 14px;background:#f8fafc;border:2px solid #e2e8f0;border-radius:10px;color:#0f172a;font-size:15px;outline:none;transition:all 0.2s}
.field input:focus{border-color:#4f46e5;background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,0.1)}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:42px}
.toggle-pass{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;cursor:pointer;font-size:16px;transition:color 0.2s}
.toggle-pass:hover{color:#4f46e5}
.btn{width:100%;padding:14px;margin-top:10px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(79,70,229,0.4)}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.status{margin-top:14px;padding:10px;border-radius:8px;font-size:13px;text-align:center;display:none;font-weight:500}
.status.error{background:#fef2f2;border:1.5px solid #fca5a5;color:#991b1b;display:block}
.status.success{background:#f0fdf4;border:1.5px solid #86efac;color:#166534;display:block}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-icon">📧</span>
    <div class="logo-title">Fast<span>Mailer</span></div>
    <div class="subtitle">Sign in to continue</div>
  </div>
  <div class="field">
    <label for="username">Username</label>
    <input id="username" type="text" placeholder="Enter your username" autocomplete="username" aria-label="Username">
  </div>
  <div class="field">
    <label for="password">Password</label>
    <div class="pass-wrap">
      <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" aria-label="Password">
      <button class="toggle-pass" id="togglePassBtn" type="button" onclick="togglePass()">👁</button>
    </div>
  </div>
  <button class="btn" id="loginBtn" type="button">Login</button>
  <div class="status" id="status"></div>
</div>
<script>
const btn=document.getElementById('loginBtn'),st=document.getElementById('status');
function togglePass(){const i=document.getElementById('password');i.type=i.type==='password'?'text':'password';}
async function doLogin(){
  const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value.trim();
  if(!u||!p){st.className='status error';st.textContent='Username and password required';return}
  btn.disabled=true;btn.textContent='Logging in...';st.className='status';
  try{
    const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(d.success){st.className='status success';st.textContent='Login successful';setTimeout(()=>window.location.href='/launcher',700)}
    else{st.className='status error';st.textContent=d.message||'Invalid credentials';btn.disabled=false;btn.textContent='Login'}
  }catch(e){st.className='status error';st.textContent='Connection error';btn.disabled=false;btn.textContent='Login'}
}
btn.addEventListener('click',doLogin);
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
</script>
</body>
</html>
