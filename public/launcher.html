<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail Launcher Console</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 30px 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 750px; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    .header h2 { color: #38bdf8; font-size: 1.4rem; }
    .logout-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .logout-btn:hover { background: #dc2626; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #94a3b8; font-weight: 500; }
    input, textarea { width: 100%; padding: 11px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 0.95rem; outline: none; }
    input:focus, textarea:focus { border-color: #38bdf8; }
    button.send-btn { width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button.send-btn:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #logBox { margin-top: 25px; background: #090d16; padding: 15px; border-radius: 6px; max-height: 250px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; border: 1px solid #334155; }
    .log-item { margin-bottom: 6px; }
    .log-success { color: #4ade80; }
    .log-error { color: #f87171; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Mail Broadcast Launcher</h2>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <!-- 1. Sender Gmail ID -->
    <div class="form-group">
      <label for="smtpUser">Sender Email (Gmail ID)</label>
      <input type="email" id="smtpUser" placeholder="your-email@gmail.com">
    </div>

    <!-- 2. Gmail App Password -->
    <div class="form-group">
      <label for="smtpPass">Gmail App Password (16-Digit Password)</label>
      <input type="password" id="smtpPass" placeholder="xxxx xxxx xxxx xxxx">
    </div>

    <!-- 3. Sender Display Name -->
    <div class="form-group">
      <label for="senderName">Sender Display Name</label>
      <input type="text" id="senderName" placeholder="e.g., Support Team">
    </div>

    <!-- 4. Subject -->
    <div class="form-group">
      <label for="subject">Email Subject</label>
      <input type="text" id="subject" placeholder="Important System Update">
    </div>

    <!-- 5. Message Body -->
    <div class="form-group">
      <label for="messageBody">Message Body (HTML Allowed)</label>
      <textarea id="messageBody" rows="5" placeholder="<p>Hello,</p><p>This is a broadcast message.</p>"></textarea>
    </div>

    <!-- 6. Recipients List -->
    <div class="form-group">
      <label for="recipients">Recipients List (One email per line)</label>
      <textarea id="recipients" rows="5" placeholder="user1@domain.com&#10;user2@domain.com"></textarea>
    </div>

    <button class="send-btn" id="sendBtn" onclick="startBroadcast()">Launch Broadcast</button>

    <div id="logBox" class="hidden"></div>
  </div>

  <script>
    if (sessionStorage.getItem('authenticated') !== 'true') {
      window.location.href = '/login.html';
    }

    function logout() {
      sessionStorage.removeItem('authenticated');
      window.location.href = '/login.html';
    }

    async function startBroadcast() {
      const smtpUser = document.getElementById('smtpUser').value.trim();
      const smtpPass = document.getElementById('smtpPass').value.trim();
      const senderName = document.getElementById('senderName').value.trim();
      const subject = document.getElementById('subject').value.trim();
      const messageBody = document.getElementById('messageBody').value;
      const recipientsRaw = document.getElementById('recipients').value;
      const recipients = recipientsRaw.split('\n').map(e => e.trim()).filter(Boolean);

      if (!smtpUser || !smtpPass || !subject || !messageBody || recipients.length === 0) {
        alert('Please fill out Gmail ID, App Password, Subject, Body, and Recipients.');
        return;
      }

      const sendBtn = document.getElementById('sendBtn');
      const logBox = document.getElementById('logBox');

      sendBtn.disabled = true;
      sendBtn.innerText = 'Dispatching Stream...';
      logBox.classList.remove('hidden');
      logBox.innerHTML = '<div class="log-item">Initializing SMTP connection...</div>';

      try {
        const response = await fetch('/api/send-stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ smtpUser, smtpPass, senderName, subject, messageBody, recipients })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split('\n\n');

          lines.forEach(line => {
            if (line.startsWith('data: ')) {
              const payload = line.replace('data: ', '').trim();
              if (payload === '[DONE]') {
                logBox.innerHTML += '<div class="log-item log-success"><b>[COMPLETE] All dispatches finished.</b></div>';
              } else {
                try {
                  const data = JSON.parse(payload);
                  if (data.success) {
                    logBox.innerHTML += `<div class="log-item log-success">[${data.progress}] Sent -> ${data.recipient}</div>`;
                  } else {
                    logBox.innerHTML += `<div class="log-item log-error">Failed -> ${data.recipient} (${data.error})</div>`;
                  }
                } catch (e) {}
              }
            }
          });
          logBox.scrollTop = logBox.scrollHeight;
        }

      } catch (err) {
        logBox.innerHTML += `<div class="log-item log-error">Network error: ${err.message}</div>`;
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = 'Launch Broadcast';
      }
    }
  </script>
</body>
</html>
