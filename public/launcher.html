<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Fast Mailer</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f1f5f9; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
    .header h2 { margin: 0; color: #0f172a; }
    .logout-btn { background: #ef4444; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    label { font-weight: 600; font-size: 13px; color: #334155; display: block; margin-top: 12px; }
    input, textarea { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    textarea { height: 110px; resize: vertical; }
    .send-btn { width: 100%; background: #10b981; color: #fff; border: none; padding: 14px; margin-top: 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
    .send-btn:hover { background: #059669; }
    .result { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; font-size: 14px; font-weight: 500; }
    .result.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; display: block; }
    .result.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Fast Mailer Launcher</h2>
      <form action="/logout" method="POST" style="margin: 0;">
        <button type="submit" class="logout-btn">Logout</button>
      </form>
    </div>

    <form id="mailForm">
      <label>Sender Name</label>
      <input type="text" id="senderName" placeholder="John Doe" required />

      <label>Gmail Address</label>
      <input type="email" id="gmailId" placeholder="yourmail@gmail.com" required />

      <label>Gmail App Password (16-Digit)</label>
      <input type="password" id="appPassword" placeholder="xxxx xxxx xxxx xxxx" required />

      <label>Recipient Email</label>
      <input type="email" id="to" placeholder="recipient@example.com" required />

      <label>Subject</label>
      <input type="text" id="subject" placeholder="Enter Subject" required />

      <label>Message Body</label>
      <textarea id="messageBody" placeholder="Enter your email message here..." required></textarea>

      <button type="submit" class="send-btn" id="sendBtn">Send Email</button>
    </form>

    <div id="resultBox" class="result"></div>
  </div>

  <script>
    document.getElementById('mailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const sendBtn = document.getElementById('sendBtn');
      const resultBox = document.getElementById('resultBox');
      
      sendBtn.disabled = true;
      sendBtn.innerText = 'Sending...';
      resultBox.style.display = 'none';

      const payload = {
        senderName: document.getElementById('senderName').value,
        gmailId: document.getElementById('gmailId').value,
        appPassword: document.getElementById('appPassword').value,
        to: document.getElementById('to').value,
        subject: document.getElementById('subject').value,
        messageBody: document.getElementById('messageBody').value
      };

      try {
        const res = await fetch('/api/send-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.success) {
          resultBox.className = 'result success';
          resultBox.innerText = `✅ Email sent successfully! Reference: ${data.refCode}`;
        } else {
          resultBox.className = 'result error';
          resultBox.innerText = `❌ Failed: ${data.message}`;
        }
      } catch (err) {
        resultBox.className = 'result error';
        resultBox.innerText = '❌ Connection error with server.';
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = 'Send Email';
      }
    });
  </script>
</body>
</html>
