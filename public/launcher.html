<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launcher - Fast Mailer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #f4f6f9;
      padding: 20px;
    }

    .navbar {
      background: #ffffff;
      padding: 15px 30px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 25px;
    }

    .navbar h2 {
      color: #333;
      font-size: 20px;
    }

    .btn-logout {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-logout:hover {
      background: #c82333;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .form-group input, 
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    .form-group input:focus, 
    .form-group textarea:focus {
      border-color: #007bff;
    }

    .btn-send {
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-send:hover {
      background: #218838;
    }

    .alert {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    .alert-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <h2>🚀 Fast Mailer Launcher</h2>
    <button class="btn-logout" id="logoutBtn">Logout</button>
  </div>

  <!-- Mail Form Container -->
  <div class="container">
    <div id="statusAlert" class="alert"></div>

    <form id="emailForm">
      <div class="form-group">
        <label for="senderTitle">Sender Name (Optional)</label>
        <input type="text" id="senderTitle" placeholder="e.g. John Doe">
      </div>

      <div class="form-group">
        <label for="recipientEmail">Recipient Email *</label>
        <input type="email" id="recipientEmail" placeholder="client@example.com" required>
      </div>

      <div class="form-group">
        <label for="subject">Subject *</label>
        <input type="text" id="subject" placeholder="Enter email subject" required>
      </div>

      <div class="form-group">
        <label for="bodyText">Message Body *</label>
        <textarea id="bodyText" placeholder="Write your message here..." required></textarea>
      </div>

      <button type="submit" class="btn-send" id="sendBtn">Send Email</button>
    </form>
  </div>

  <script>
    const emailForm = document.getElementById('emailForm');
    const statusAlert = document.getElementById('statusAlert');
    const sendBtn = document.getElementById('sendBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    // Send Email Handler
    emailForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      statusAlert.style.display = 'none';
      sendBtn.innerText = 'Sending...';
      sendBtn.disabled = true;

      const payload = {
        senderTitle: document.getElementById('senderTitle').value.trim(),
        recipientEmail: document.getElementById('recipientEmail').value.trim(),
        subject: document.getElementById('subject').value.trim(),
        bodyText: document.getElementById('bodyText').value.trim()
      };

      try {
        const response = await fetch('/api/send-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showAlert('success', '✅ Email sent successfully!');
          emailForm.reset();
        } else {
          showAlert('error', '❌ ' + (data.message || 'Failed to send email.'));
        }
      } catch (err) {
        console.error(err);
        showAlert('error', '❌ Server network error.');
      } finally {
        sendBtn.innerText = 'Send Email';
        sendBtn.disabled = false;
      }
    });

    // Logout Handler
    logoutBtn.addEventListener('click', async () => {
      try {
        const res = await fetch('/api/logout', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/';
        }
      } catch (err) {
        console.error('Logout error:', err);
      }
    });

    function showAlert(type, message) {
      statusAlert.className = `alert alert-${type === 'success' ? 'success' : 'error'}`;
      statusAlert.innerText = message;
      statusAlert.style.display = 'block';
    }
  </script>

</body>
</html>
